.k {
  --hormigon:#F4F3F7; --hormigon-2:#FFFFFF; --hormigon-3:#DAD8E6;
  --acero:#2E2B71; --acero-2:#4A4790; --acero-3:#8F8CB8;
  --soldadura:#F08525; --verde:#1B7F4B; --oxido:#C0203A; --acmanet:#29ABE2;
  --display:"Open Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --texto:"Open Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --dato:"SF Mono",ui-monospace,Menlo,monospace;
  --gut:20px;

  min-height:100%; background:var(--hormigon); color:var(--acero);
  font-family:var(--texto);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column;

.k *, .k *::before, .k *::after { box-sizing:border-box; }
.k button { font-family:inherit; color:inherit; cursor:pointer; border:0; background:none; }
.k .mono { font-family:var(--dato); font-variant-numeric:tabular-nums; letter-spacing:-0.03em; }
.k .disp { font-family:var(--display); font-weight:800; letter-spacing:-0.018em; }

.k .logo { height:30px; width:auto; display:block; }
.k .logoNet { height:26px; width:auto; display:block; }

.k .malla { position:fixed; inset:0; pointer-events:none; z-index:0; }

.k .top { position:sticky; top:0; z-index:5; display:flex; align-items:center;
  justify-content:space-between; gap:12px; padding:12px var(--gut);
  background:rgba(244,243,247,.93); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--hormigon-3); flex:0 0 auto; }
.k .marca { display:flex; align-items:center; gap:10px; min-width:0; }
.k .marca span { font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--acero-3); font-weight:700; }
.k .hilo { display:flex; align-items:center; flex:0 0 auto; }
.k .nodo { width:9px; height:9px; transform:rotate(45deg); background:var(--hormigon-3);
  transition:background .45s ease, box-shadow .45s ease; }
.k .nodo[data-on="1"] { background:var(--soldadura); box-shadow:0 0 0 3px rgba(255,107,0,.16); }
.k .tramo { width:16px; height:2px; background:var(--hormigon-3); }
.k .tramo[data-on="1"] { background:var(--soldadura); }

/* \u2500\u2500 escenario \u2500\u2500 */
.k .escena { position:relative; z-index:2; flex:1 1 auto; padding:14px var(--gut) 0; }
/* El contenido va sobre una hoja opaca: la malla se ve alrededor y detr\xE1s de los
   bordes, pero nunca por debajo de un texto. Es el mismo lenguaje de .placa. */
.k .paso { padding:22px 18px 18px; background:rgba(255,255,255,.94);
  border:1px solid rgba(46,43,113,.08); box-shadow:0 14px 34px -24px rgba(46,43,113,.5);
  animation:entra .34s cubic-bezier(.2,.7,.3,1) both; }
@keyframes entra { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .k .paso { animation:none; } }

.k .rotulo { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--soldadura);
  font-weight:700; margin-bottom:8px; }
.k h1 { font-family:var(--display); font-weight:700; font-size:clamp(30px,8vw,56px); line-height:1.02;
  margin:0; letter-spacing:-0.015em; }
.k h2 { font-family:var(--display); font-weight:700; font-size:clamp(23px,5.6vw,34px); line-height:1.06;
  margin:0 0 6px; letter-spacing:-0.012em; }
.k .bajada { font-size:15px; line-height:1.55; color:var(--acero-2); max-width:58ch; margin:12px 0 0; }

/* \u2500\u2500 pie pegado abajo \u2500\u2500 */
.k .pie { position:sticky; bottom:0; z-index:5; display:flex; align-items:center;
  justify-content:space-between; gap:10px; padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));
  background:rgba(244,243,247,.95); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--hormigon-3); flex:0 0 auto; margin-top:18px; }
.k .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:50px;
  padding:0 20px; background:var(--acero); color:var(--hormigon-2); font-family:var(--display);
  font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase;
  transition:transform .12s ease; }
.k .btn:active { transform:scale(.97); }
.k .btn.pri { background:var(--soldadura); color:#fff; }
.k .btn.fant { background:transparent; color:var(--acero-3); padding:0 6px; font-size:14px; }
.k .btn[disabled] { opacity:.3; }

/* \u2500\u2500 tipolog\xEDas \u2500\u2500 */
.k .rejilla { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.k .tipo { position:relative; text-align:left; background:var(--hormigon); border:2px solid transparent;
  padding:14px 13px 12px; min-height:106px; display:flex; flex-direction:column;
  justify-content:space-between; transition:background .18s, border-color .18s, transform .12s; }
.k .tipo:active { transform:scale(.985); }
.k .tipo[data-on="1"] { background:var(--acero); border-color:var(--soldadura); color:var(--hormigon-2); }
.k .tipo b { font-family:var(--display); font-weight:700; font-size:15.5px; line-height:1.1; display:block; }
.k .tipo span { font-size:11px; line-height:1.3; color:var(--acero-3); margin-top:5px; display:block; }
.k .tipo[data-on="1"] span { color:#9DB0D2; }
.k .tipo .marca-sel { position:absolute; top:10px; right:10px; width:9px; height:9px;
  transform:rotate(45deg); background:var(--soldadura); opacity:0; transition:opacity .18s; }
.k .tipo[data-on="1"] .marca-sel { opacity:1; }

/* el proyecto propio: ocupa el ancho y se distingue del resto */
.k .tipo.propio { grid-column:1 / -1; min-height:0; border:2px dashed var(--acero-3);
  background:transparent; flex-direction:row; align-items:center; gap:12px; padding:14px 15px; }
.k .tipo.propio[data-on="1"] { background:var(--acero); border-style:solid; border-color:var(--soldadura); }
.k .tipo.propio .ico { flex:0 0 auto; width:26px; height:26px; display:grid; place-items:center;
  border:2px solid var(--soldadura); color:var(--soldadura); font-size:17px; font-weight:700;
  font-family:var(--dato); line-height:1; }
.k .tipo.propio .tx { min-width:0; }
.k .tipo.propio span { margin-top:3px; }

/* \u2500\u2500 campos \u2500\u2500 */
.k .campo { margin-top:16px; }
.k .campo label { display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--acero-3); font-weight:700; margin-bottom:8px; }
.k .stepper { display:flex; align-items:stretch; background:var(--hormigon); }
.k .stepper button { width:58px; font-size:27px; font-weight:300; line-height:1; background:var(--acero);
  color:var(--hormigon-2); transition:transform .1s ease; }
.k .stepper button:active { transform:scale(.94); }
.k .stepper button[disabled] { background:var(--hormigon-3); color:var(--acero-3); }
.k .stepper .val { flex:1; display:flex; align-items:center; justify-content:center;
  font-family:var(--dato); font-size:30px; font-weight:700; font-variant-numeric:tabular-nums;
  padding:10px 4px; min-width:0; }
.k .atajos { display:flex; gap:6px; margin-top:8px; }
.k .atajos button { flex:1; min-height:40px; background:var(--hormigon); font-size:13.5px;
  font-weight:600; font-family:var(--dato); border:1px solid var(--hormigon-3); }
.k .atajos button[data-on="1"] { background:var(--acero); color:var(--hormigon-2); border-color:var(--acero); }
.k .resumenDim { margin-top:20px; padding-top:13px; border-top:2px solid var(--acero);
  display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.k .resumenDim div span { display:block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--acero-3); font-weight:700; }
.k .resumenDim div b { font-family:var(--dato); font-size:19px; font-weight:700; }

/* \u2500\u2500 campos del proyecto propio \u2500\u2500 */
.k .editor { margin-top:14px; display:grid; gap:10px; }
.k .fila { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
  background:var(--hormigon); border:1px solid var(--hormigon-3); padding:10px 12px; }
.k .fila .et { min-width:0; }
.k .fila .et b { display:block; font-size:13.5px; font-weight:700; line-height:1.2; }
.k .fila .et span { display:block; font-size:10.5px; color:var(--acero-3); margin-top:2px; line-height:1.3; }
.k .fila input { width:104px; font-family:var(--dato); font-size:17px; font-weight:700; text-align:right;
  border:0; border-bottom:2px solid var(--acero); background:transparent; color:var(--acero);
  padding:3px 4px; -moz-appearance:textfield; }
.k .fila input::-webkit-outer-spin-button, .k .fila input::-webkit-inner-spin-button {
  -webkit-appearance:none; margin:0; }
.k .fila input:focus { outline:none; border-bottom-color:var(--soldadura); }
.k .fila .uni { font-size:11px; color:var(--acero-3); font-weight:700; margin-left:5px; }
.k .grupoT { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--acero-3);
  font-weight:700; margin:16px 0 -2px; }

/* \u2500\u2500 resultado \u2500\u2500 */
.k .cifra { font-family:var(--display); font-weight:700; font-size:clamp(46px,14vw,110px);
  line-height:.92; letter-spacing:-0.035em; color:var(--verde); }
.k .kpis { display:grid; grid-template-columns:1fr; gap:0; margin-top:20px;
  border-top:2px solid var(--acero); }
.k .kpi { padding:14px 0 12px; border-bottom:1px solid var(--hormigon-3);
  display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:baseline; }
.k .kpi:last-child { border-bottom:0; }
.k .kpi b { font-family:var(--dato); font-size:28px; font-weight:700; line-height:1; grid-row:span 2; }
.k .kpi span { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--acero-3); font-weight:700; line-height:1.3; }
.k .kpi em { font-style:normal; font-size:12px; color:var(--acero-2); }

/* \u2500\u2500 gr\xE1ficos \u2500\u2500 */
.k .pestanas { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch; margin-top:4px; padding-bottom:2px; }
.k .pestanas::-webkit-scrollbar { display:none; }
.k .pestanas button { flex:0 0 auto; padding:9px 13px; font-family:var(--display); font-weight:700;
  font-size:12.5px; letter-spacing:.02em; color:var(--acero-3); background:var(--hormigon-2);

.k .pestanas button[data-on="1"] { color:#fff; background:var(--acero);

.k .lienzo { padding:14px 0 0; }
.k .placa { background:var(--hormigon); border:1px solid rgba(46,43,113,.10);
  box-shadow:0 10px 26px -18px rgba(14,35,64,.42); padding:14px 12px 12px; position:relative; }
.k .placa::before { content:""; position:absolute; left:0; top:0; width:36px; height:3px;

.k .leyendaG { font-size:13px; line-height:1.55; color:var(--acero-2); margin:12px 0 0; max-width:66ch; }

.k .netBox { border:1px solid var(--hormigon-3); background:var(--hormigon); padding:15px 16px;
  border-left:4px solid var(--acmanet); margin-top:16px; }
.k .netBox h4 { font-family:var(--display); font-weight:800; font-size:16px; margin:11px 0 7px;

.k .ficha { background:var(--acero); color:var(--hormigon-2); padding:18px 18px; margin-top:16px; }
.k .ficha h3 { font-family:var(--display); font-weight:700; font-size:19px; margin:0 0 10px; }
.k .ficha p { font-size:12.5px; line-height:1.55; color:#BEBCDC; margin:0 0 5px; }
.k .ficha .dat { font-family:var(--dato); font-size:14.5px; margin-top:10px; color:#fff;

.k .ficha a { color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.4); }
.k .fuenteBox { border-left:3px solid var(--soldadura); padding:3px 0 3px 14px; }
.k .fuenteBox b { font-family:var(--dato); font-size:22px; display:block; color:var(--acero); }
.k .fuenteBox span { font-size:12px; line-height:1.55; color:var(--acero-2); display:block; margin-top:5px; }

  display:flex; flex-direction:column; justify-content:center; padding:0 var(--gut);
  cursor:pointer; overflow-y:auto; }
/* Velo vertical: la malla sigue vi\xE9ndose arriba y abajo, pero detr\xE1s del bloque
   de texto el fondo se vuelve s\xF3lido y el titular deja de pelear con los rombos. */
.k .portada::after { content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, rgba(46,43,113,0) 0%, rgba(46,43,113,.82) 18%,

.k .portada h1 { color:#fff; font-size:clamp(32px,9vw,68px); }
.k .portada .sub { font-size:clamp(15px,4vw,20px); line-height:1.5; color:#C7D4EA;
  max-width:46ch; margin:18px 0 0; }
.k .toque { margin-top:30px; display:inline-flex; align-items:center; gap:12px;
  font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--soldadura); }
.k .pulso { width:11px; height:11px; transform:rotate(45deg); background:var(--soldadura);
  animation:pulso 1.9s ease-in-out infinite; }
@keyframes pulso { 0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(255,107,0,.5); }
  50% { opacity:.72; box-shadow:0 0 0 11px rgba(255,107,0,0); } }
.k .piePortada { margin-top:34px; display:flex; flex-wrap:wrap; gap:4px 18px;
  font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#AEBDD9; font-weight:700; }

/* \u2500\u2500 pantallas grandes: el kiosco y el escritorio siguen funcionando \u2500\u2500 */
@media (min-width:760px){
  .k { --gut:40px; }
  .k .logo { height:36px; }
  .k .rejilla { grid-template-columns:repeat(3,1fr); gap:14px; }
  .k .tipo { min-height:124px; padding:18px 17px 15px; }
  .k .tipo b { font-size:19px; }
  .k .tipo span { font-size:12px; }
  .k .kpis { grid-template-columns:repeat(3,1fr); }
  .k .kpi { padding:16px 20px 12px; border-bottom:0; border-left:1px solid var(--hormigon-3);
    display:block; }
  .k .kpi:first-child { border-left:0; padding-left:0; }
  .k .kpi b { font-size:36px; display:block; }
  .k .kpi span { display:block; margin-top:9px; font-size:11.5px; }
  .k .kpi em { display:block; margin-top:5px; font-size:12.5px; }
  .k .editor { grid-template-columns:1fr 1fr; }
  .k .grupoT { grid-column:1 / -1; }
  .k .btn { min-height:56px; font-size:18px; padding:0 28px; }
  .k .nodo { width:12px; height:12px; }
  .k .tramo { width:34px; }
  .k .pestanas button { font-size:14.5px; padding:11px 18px; }
  .k .placa { padding:18px 22px 15px; }
  .k .cierreG { display:grid; grid-template-columns:1.2fr 1fr; gap:22px; align-items:start; }
  .k .ficha, .k .netBox { margin-top:0; }
  .k .netBox { margin-top:18px; }
}
@media (min-width:1100px){
  .k { --gut:72px; }
}
